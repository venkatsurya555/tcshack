<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="probBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071C26"/>
      <stop offset="50%" stop-color="#0B2633"/>
      <stop offset="100%" stop-color="#173744"/>
    </linearGradient>
    <linearGradient id="floodWater" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20C5B5" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#42D9E8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0B2633" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#probBg)"/>

  <!-- Swollen River / Flooded Terrain -->
  <path d="M 0 260 Q 250 200 480 270 T 800 240 L 800 600 L 0 600 Z" fill="url(#floodWater)"/>
  
  <!-- Submerged Road Edge / Guard Rail -->
  <path d="M 0 380 Q 300 350 800 390" stroke="#FF965C" stroke-width="4" stroke-dasharray="12,8" fill="none"/>
  
  <!-- Emergency Fire / Rescue Truck (navigating alongside flooded road as in PDF Slide 2) -->
  <g transform="translate(460, 230)">
    <!-- Truck Shadow -->
    <ellipse cx="110" cy="115" rx="100" ry="12" fill="rgba(0,0,0,0.5)"/>

    <!-- Cab & Body -->
    <rect x="20" y="20" width="170" height="80" rx="6" fill="#D9381E" stroke="#FF965C" stroke-width="1.5"/>
    <rect x="140" y="30" width="55" height="50" rx="4" fill="#B3240E"/>
    
    <!-- Windshield -->
    <path d="M 145 35 L 185 35 L 192 60 L 145 60 Z" fill="#A9BEC8" opacity="0.8"/>
    
    <!-- Side windows -->
    <rect x="90" y="35" width="45" height="25" rx="2" fill="#071C26"/>
    
    <!-- Stripe -->
    <rect x="20" y="70" width="175" height="12" fill="#F4F8FA"/>
    <rect x="20" y="73" width="175" height="6" fill="#FF965C"/>

    <!-- Wheels -->
    <circle cx="55" cy="102" r="18" fill="#173744" stroke="#A9BEC8" stroke-width="3"/>
    <circle cx="55" cy="102" r="8" fill="#F4F8FA"/>
    
    <circle cx="155" cy="102" r="18" fill="#173744" stroke="#A9BEC8" stroke-width="3"/>
    <circle cx="155" cy="102" r="8" fill="#F4F8FA"/>

    <!-- Emergency Roof Light (Flashing) -->
    <rect x="160" y="10" width="20" height="10" rx="3" fill="#42D9E8"/>
    <polygon points="170,5 120,-30 220,-30" fill="rgba(66, 217, 232, 0.25)"/>
  </g>

  <!-- Water Surface Reflections & Spray -->
  <path d="M 400 370 C 450 360, 520 375, 680 365" stroke="#42D9E8" stroke-width="2" fill="none" opacity="0.6"/>
  <ellipse cx="580" cy="350" rx="90" ry="14" fill="none" stroke="rgba(255, 150, 92, 0.4)" stroke-width="1.5"/>

  <!-- Warning telemetry marker -->
  <g transform="translate(180, 200)">
    <circle r="30" fill="#173744" stroke="#FF965C" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#FF965C" font-size="20" font-weight="bold">!</text>
    <rect x="-80" y="42" width="160" height="30" rx="6" fill="#071C26" stroke="#FF965C" stroke-width="1"/>
    <text x="0" y="62" text-anchor="middle" fill="#F4F8FA" font-family="'Space Grotesk', sans-serif" font-size="11">ROAD WATERLOGGED: 1.2M</text>
  </g>

  <!-- Secondary marker: Stale report -->
  <g transform="translate(680, 140)">
    <circle r="22" fill="#173744" stroke="#A9BEC8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="0" y="5" text-anchor="middle" fill="#A9BEC8" font-size="14">⏱</text>
    <rect x="-65" y="32" width="130" height="24" rx="4" fill="#071C26" stroke="#A9BEC8" stroke-width="1"/>
    <text x="0" y="48" text-anchor="middle" fill="#A9BEC8" font-family="'Space Grotesk', sans-serif" font-size="10">UNVERIFIED REPORT (2h old)</text>
  </g>
</svg>
